<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWeb - Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="login-section" class="form-section">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="log_cor" placeholder="Correo Electrónico">
            <input type="password" id="log_pass" placeholder="Contraseña">
            <button onclick="login()">Entrar</button>
            <p class="toggle-text">¿No tienes cuenta? <span onclick="toggleForm()">Regístrate aquí</span></p>
        </div>

        <div id="register-section" class="form-section" style="display: none;">
            <h2>Crear Cuenta</h2>
            <input type="text" id="reg_nom" placeholder="Nombre">
            <input type="text" id="reg_pat" placeholder="Apellido Paterno">
            <input type="text" id="reg_mat" placeholder="Apellido Materno">
            <input type="text" id="reg_tel" placeholder="Teléfono">
            <input type="email" id="reg_cor" placeholder="Correo">
            <button onclick="registrar()">Registrarse</button>
            <p class="toggle-text">¿Ya tienes cuenta? <span onclick="toggleForm()">Inicia sesión</span></p>
        </div>
    </div>

    <script>
        // Función para cambiar entre Login y Registro
        function toggleForm() {
            const loginSec = document.getElementById('login-section');
            const registerSec = document.getElementById('register-section');
            
            if (loginSec.style.display === "none") {
                loginSec.style.display = "block";
                registerSec.style.display = "none";
            } else {
                loginSec.style.display = "none";
                registerSec.style.display = "block";
            }
        }

        async function registrar() {
            const data = {
                nombre: document.getElementById('reg_nom').value,
                ap_paterno: document.getElementById('reg_pat').value,
                ap_materno: document.getElementById('reg_mat').value,
                telefono: document.getElementById('reg_tel').value,
                correo: document.getElementById('reg_cor').value
            };
            const res = await fetch('/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert(await res.text());
            toggleForm(); 
        }

        async function login() {
            const correo = document.getElementById('log_cor').value;
            const password = document.getElementById('log_pass').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({correo, password})
            });
            if(res.ok) {
                alert("Sesión iniciada");
            } else {
                alert("Error en las credenciales");
            }
        }
    </script>
</body>
</html>

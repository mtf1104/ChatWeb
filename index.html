<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWeb - Acceso Escolar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos rápidos para el formulario de teléfono */
        .phone-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .phone-group select { width: 35%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .phone-group input { width: 65%; margin-bottom: 0; }
        .status-msg { font-size: 0.9em; margin-top: 10px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section">
            <h2>Bienvenido a ChatWeb</h2>
            <p>Ingresa con tu correo y clave temporal</p>
            <input type="email" id="log_cor" placeholder="Correo Electrónico" required>
            <input type="password" id="log_pass" placeholder="Contraseña" required>
            <button onclick="login()">Iniciar Sesión</button>
            <p class="toggle-text">¿No tienes cuenta? <span onclick="toggleAuth()" style="color:blue; cursor:pointer;">Regístrate aquí</span></p>
        </div>

        <div id="register-section" style="display:none;">
            <h2>Crea tu cuenta</h2>
            <input type="text" id="reg_nom" placeholder="Nombre" required>
            <input type="text" id="reg_apa" placeholder="Apellido Paterno" required>
            <input type="text" id="reg_ama" placeholder="Apellido Materno" required>
            
            <div class="phone-group">
                <select id="country_code">
                    <option value="52">🇲🇽 +52</option>
                    <option value="1">🇺🇸 +1</option>
                    <option value="34">🇪🇸 +34</option>
                    <option value="54">🇦🇷 +54</option>
                </select>
                <input type="text" id="reg_tel" placeholder="Número (10 dígitos)" maxlength="10">
            </div>

            <input type="email" id="reg_cor" placeholder="Correo Electrónico" required>
            <button id="btn-registro" onclick="registro()">Registrarme y recibir correo</button>
            <p class="toggle-text">¿Ya tienes cuenta? <span onclick="toggleAuth()" style="color:blue; cursor:pointer;">Inicia sesión</span></p>
            <div id="reg-status" class="status-msg"></div>
        </div>
    </div>

    <script>
        // Cambiar entre Login y Registro
        function toggleAuth() {
            const login = document.getElementById('login-section');
            const register = document.getElementById('register-section');
            login.style.display = (login.style.display === 'none') ? 'block' : 'none';
            register.style.display = (register.style.display === 'none') ? 'block' : 'none';
        }

        // Función para Iniciar Sesión
        async function login() {
            const correo = document.getElementById('log_cor').value;
            const password = document.getElementById('log_pass').value;

            if(!correo || !password) return alert("Por favor, llena todos los campos.");

            try {
                const res = await fetch('index.php?action=login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({correo, password})
                });
                
                const result = await res.json();
                
                if (result.status === 'success') {
                    alert("¡Bienvenido " + result.user.nombre + "!");
                    window.location.href = result.redirect; 
                } else { 
                    alert("Error: " + result.message); 
                }
            } catch (e) { 
                alert("Error de conexión con el servidor en Render."); 
            }
        }

        // Función para Registrar Usuario
        async function registro() {
            const btn = document.getElementById('btn-registro');
            const status = document.getElementById('reg-status');
            const cod = document.getElementById('country_code').value;
            const num = document.getElementById('reg_tel').value.replace(/\D/g, '');
            
            const datos = {
                nombre: document.getElementById('reg_nom').value,
                ap_paterno: document.getElementById('reg_apa').value,
                ap_materno: document.getElementById('reg_ama').value,
                telefono: cod + num,
                correo: document.getElementById('reg_cor').value
            };

            if(!num || !datos.nombre || !datos.correo) {
                return alert("Faltan datos importantes para el registro.");
            }

            // Deshabilitar botón para evitar múltiples clics mientras se envía el correo
            btn.disabled = true;
            status.innerText = "Procesando registro y enviando correo...";

            try {
                const res = await fetch('index.php?action=registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });

                const result = await res.json();

                if (result.status === 'success') {
                    let mensajeFinal = `¡Registro exitoso!\nTu clave temporal es: ${result.temp_pass}`;
                    
                    if (result.mail_ok) {
                        mensajeFinal += "\n\nSe ha enviado un correo con tus datos.";
                    } else {
                        mensajeFinal += "\n\nNota: El correo no pudo enviarse, pero guarda tu clave.";
                    }

                    alert(mensajeFinal);
                    
                    // Opcional: Abrir WhatsApp para respaldo de la clave
                    const msg = `Hola ${datos.nombre}, mi clave de ChatWeb es: ${result.temp_pass}`;
                    window.open(`https://wa.me/${datos.telefono}?text=${encodeURIComponent(msg)}`, '_blank');
                    
                    toggleAuth();
                } else { 
                    alert(result.message); 
                }
            } catch (e) { 
                alert("Hubo un problema al conectar con el backend."); 
            } finally {
                btn.disabled = false;
                status.innerText = "";
            }
        }
    </script>
</body>
</html>

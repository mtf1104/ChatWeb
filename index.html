<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChatWeb - Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" id="login-card">
            <h2>Bienvenido a ChatWeb</h2>
            <div class="input-group">
                <input type="email" id="log_cor" placeholder="Correo Electrónico" required>
                <input type="password" id="log_pass" placeholder="Contraseña" required>
            </div>
            <button class="btn-primary" onclick="login()">Iniciar Sesión</button>
            <p>¿No tienes cuenta? <a href="#" onclick="toggleAuth()">Regístrate aquí</a></p>
        </div>

        <div class="auth-card" id="register-card" style="display:none;">
            <h2>Crea tu cuenta</h2>
            <div class="input-group">
                <input type="text" id="reg_nom" placeholder="Nombre" required>
                <input type="text" id="reg_apa" placeholder="Apellido Paterno" required>
                <input type="text" id="reg_ama" placeholder="Apellido Materno" required>
                <input type="text" id="reg_tel" placeholder="Teléfono" required>
                <input type="email" id="reg_cor" placeholder="Correo Electrónico" required>
            </div>
            <button class="btn-primary" onclick="registro()">Registrarme</button>
            <p>¿Ya tienes cuenta? <a href="#" onclick="toggleAuth()">Inicia sesión</a></p>
        </div>
    </div>

    <script>
        function toggleAuth() {
            const login = document.getElementById('login-card');
            const register = document.getElementById('register-card');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                register.style.display = 'none';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
            }
        }

        async function login() {
            const correo = document.getElementById('log_cor').value;
            const password = document.getElementById('log_pass').value;
            const res = await fetch('index.php?action=login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({correo, password})
            });
            if (res.ok) {
                const result = await res.json();
                alert("¡Bienvenido!");
                window.location.href = result.redirect; 
            } else {
                alert("Credenciales incorrectas");
            }
        }

        async function registro() {
            const datos = {
                nombre: document.getElementById('reg_nom').value,
                ap_paterno: document.getElementById('reg_apa').value,
                ap_materno: document.getElementById('reg_ama').value,
                telefono: document.getElementById('reg_tel').value,
                correo: document.getElementById('reg_cor').value
            };
            const res = await fetch('index.php?action=registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(datos)
            });
            const texto = await res.text();
            alert(texto);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWeb - Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="login-section">
            <h2>Bienvenido a ChatWeb</h2>
            <input type="email" id="log_cor" placeholder="Correo Electrónico" required>
            <input type="password" id="log_pass" placeholder="Contraseña" required>
            <button onclick="login()">Iniciar Sesión</button>
            <p class="toggle-text">¿No tienes cuenta? <span onclick="toggleAuth()">Regístrate aquí</span></p>
        </div>

        <div id="register-section" style="display:none;">
            <h2>Crea tu cuenta</h2>
            <input type="text" id="reg_nom" placeholder="Nombre" required>
            <input type="text" id="reg_apa" placeholder="Apellido Paterno" required>
            <input type="text" id="reg_ama" placeholder="Apellido Materno" required>
            <input type="text" id="reg_tel" placeholder="Teléfono" required>
            <input type="email" id="reg_cor" placeholder="Correo Electrónico" required>
            <button onclick="registro()">Registrarme</button>
            <p class="toggle-text">¿Ya tienes cuenta? <span onclick="toggleAuth()">Inicia sesión</span></p>
        </div>
    </div>

    <script>
        // Cambiar entre formularios
        function toggleAuth() {
            const login = document.getElementById('login-section');
            const register = document.getElementById('register-section');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                register.style.display = 'none';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
            }
        }

        // Función de Inicio de Sesión
        async function login() {
            const correo = document.getElementById('log_cor').value;
            const password = document.getElementById('log_pass').value;

            if(!correo || !password) return alert("Completa todos los campos");

            try {
                const res = await fetch('index.php?action=login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({correo, password})
                });

                const result = await res.json();

                if (res.ok && result.status === 'success') {
                    alert("¡Bienvenido, " + result.user.nombre + "!");
                    window.location.href = result.redirect; 
                } else {
                    alert("Error: " + (result.message || "Credenciales incorrectas"));
                }
            } catch (error) {
                console.error("Error en login:", error);
                alert("Hubo un problema al conectar con el servidor.");
            }
        }

        // Función de Registro
        async function registro() {
            const datos = {
                nombre: document.getElementById('reg_nom').value,
                ap_paterno: document.getElementById('reg_apa').value,
                ap_materno: document.getElementById('reg_ama').value,
                telefono: document.getElementById('reg_tel').value,
                correo: document.getElementById('reg_cor').value
            };

            // Validación simple
            if(Object.values(datos).some(val => val === "")) return alert("Todos los campos son obligatorios");

            try {
                const res = await fetch('index.php?action=registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });

                const texto = await res.text();
                alert(texto);

                if (res.ok) {
                    toggleAuth(); // Regresar al login tras registro exitoso
                }
            } catch (error) {
                console.error("Error en registro:", error);
                alert("No se pudo procesar el registro.");
            }
        }
    </script>
</body>
</html>

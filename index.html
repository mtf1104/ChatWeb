<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatWeb - Acceso</title>
    
    <link rel="manifest" href="index.php?action=manifest">
    <meta name="theme-color" content="#00a884">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712035.png">

    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page"> <div class="container">
        <div id="login-section">
            <h2>Bienvenido a ChatWeb</h2>
            <input type="email" id="log_cor" placeholder="Correo Electrónico" required>
            <input type="password" id="log_pass" placeholder="Contraseña" required>
            <button id="btn-login" onclick="login()">Iniciar Sesión</button>
            <p class="toggle-text">¿No tienes cuenta? <span onclick="toggleAuth()">Regístrate aquí</span></p>
        </div>

        <div id="register-section" style="display:none;">
            <h2>Crea tu cuenta</h2>
            <input type="text" id="reg_nom" placeholder="Nombre" required>
            <input type="text" id="reg_apa" placeholder="Apellido Paterno" required>
            <input type="text" id="reg_ama" placeholder="Apellido Materno" required>
            
            <label style="display:block; text-align:left; font-size:12px; margin-bottom:5px; color:var(--gray);">Teléfono:</label>
            <div style="display:flex; gap:5px; margin-bottom:15px;">
                <select id="country_code" style="width:30%; padding:10px; border-radius:8px; border:1px solid #e1e1e1;">
                    <option value="52">🇲🇽 +52</option>
                    <option value="1">🇺🇸 +1</option>
                    <option value="34">🇪🇸 +34</option>
                </select>
                <input type="text" id="reg_tel" placeholder="Número (10 dígitos)" style="margin-bottom:0; width:70%;" required>
            </div>

            <input type="email" id="reg_cor" placeholder="Correo Electrónico" required>
            
            <label class="file-label" style="display:block; font-size:12px; color:var(--gray); margin-bottom:5px; text-align:left;">Foto de perfil (opcional):</label>
            <input type="file" id="reg_foto" accept="image/*" style="margin-bottom:15px; font-size:12px; border:none; padding:0;">

            <button id="btn-registro" onclick="registro()">Registrarme</button>
            <p class="toggle-text">¿Ya tienes cuenta? <span onclick="toggleAuth()">Inicia sesión</span></p>
        </div>
    </div>

    <script>
        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
            });
        }

        function toggleAuth() {
            const login = document.getElementById('login-section');
            const register = document.getElementById('register-section');
            login.style.display = (login.style.display === 'none') ? 'block' : 'none';
            register.style.display = (register.style.display === 'none') ? 'block' : 'none';
        }

        async function login() {
            const btn = document.getElementById('btn-login');
            const correo = document.getElementById('log_cor').value;
            const password = document.getElementById('log_pass').value;

            if(!correo || !password) return alert("Completa los campos.");

            btn.disabled = true;
            btn.innerText = "Cargando...";

            try {
                const res = await fetch('index.php?action=login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({correo, password})
                });
                const result = await res.json();
                
                if (result.status === 'success') {
                    window.location.href = result.redirect; 
                } else { 
                    alert(result.message); 
                }
            } catch (e) { 
                alert("Error de conexión con el servidor."); 
            } finally {
                btn.disabled = false;
                btn.innerText = "Iniciar Sesión";
            }
        }

        async function registro() {
            const btn = document.getElementById('btn-registro');
            const cod = document.getElementById('country_code').value;
            const num = document.getElementById('reg_tel').value.replace(/\D/g, '');
            const nombre = document.getElementById('reg_nom').value;
            const correo = document.getElementById('reg_cor').value;
            const foto = document.getElementById('reg_foto').files[0];

            if(!num || !nombre || !correo) return alert("Llena los campos obligatorios");

            btn.disabled = true;
            btn.innerText = "Procesando...";

            const formData = new FormData();
            formData.append('nombre', nombre);
            formData.append('ap_paterno', document.getElementById('reg_apa').value);
            formData.append('ap_materno', document.getElementById('reg_ama').value);
            formData.append('telefono', cod + num);
            formData.append('correo', correo);
            if(foto) formData.append('foto_perfil', foto);

            try {
                const res = await fetch('index.php?action=registro', {
                    method: 'POST',
                    body: formData 
                });
                
                const result = await res.json();

                if (result.status === 'success') {
                    alert(`¡EXITO!\nCuenta creada.\nContraseña temporal: ${result.temp_pass}`);
                    
                    const msg = `Hola ${nombre}, mi clave de ChatWeb es: ${result.temp_pass}`;
                    const url = `https://wa.me/${cod + num}?text=${encodeURIComponent(msg)}`;
                    window.open(url, '_blank');

                    toggleAuth();
                } else { 
                    alert(result.message); 
                } 
            } catch (e) { 
                console.error(e);
                alert("Error en el registro. Intenta de nuevo."); 
            } finally {
                btn.disabled = false;
                btn.innerText = "Registrarme";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <title>ChatWeb - Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: space-around; padding: 50px; }
        form { display: flex; flex-direction: column; gap: 10px; width: 300px; }
    </style>
</head>
<body>
    <div>
        <h2>Registro</h2>
        <input id="reg_nom" placeholder="Nombre">
        <input id="reg_pat" placeholder="Apellido Paterno">
        <input id="reg_mat" placeholder="Apellido Materno">
        <input id="reg_tel" placeholder="Teléfono">
        <input id="reg_cor" placeholder="Correo">
        <button onclick="registrar()">Registrar y recibir clave</button>
    </div>

    <div>
        <h2>Login</h2>
        <input id="log_cor" placeholder="Correo">
        <input id="log_pass" type="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
    </div>

    <script>
        async function registrar() {
            const data = {
                nombre: document.getElementById('reg_nom').value,
                ap_paterno: document.getElementById('reg_pat').value,
                ap_materno: document.getElementById('reg_mat').value,
                telefono: document.getElementById('reg_tel').value,
                correo: document.getElementById('reg_cor').value
            };
            const res = await fetch('/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert(await res.text());
        }

        async function login() {
            const correo = document.getElementById('log_cor').value;
            const password = document.getElementById('log_pass').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({correo, password})
            });
            const result = await res.json();
            alert(result.message);
        }
    </script>
</body>
</html>

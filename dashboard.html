<!DOCTYPE html>
<html lang="es">
<head>
    <title>ChatWeb - Mensajes</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container { display: flex; height: 90vh; }
        .sidebar { width: 30%; border-right: 1px solid #ccc; overflow-y: auto; }
        .chat-window { width: 70%; display: flex; flex-direction: column; }
        .user-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .user-item:hover { background: #f0f0f0; }
        #messages { flex-grow: 1; padding: 20px; background: #fafafa; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar" id="user-list">
            <h3>Contactos</h3>
            </div>
        <div class="chat-window">
            <div id="chat-header">Selecciona un chat</div>
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Escribe un mensaje...">
                <button onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Cargar usuarios al iniciar
        async function cargarUsuarios() {
            const res = await fetch('obtener_usuarios.php');
            const usuarios = await res.json();
            const list = document.getElementById('user-list');
            
            usuarios.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<strong>${user.nombre}</strong><br><small>${user.correo}</small>`;
                div.onclick = () => abrirChat(user.id_usuario, user.nombre);
                list.appendChild(div);
            });
        }

        function abrirChat(id, nombre) {
            document.getElementById('chat-header').innerText = "Chat con: " + nombre;
            // Aquí llamarías a otra función PHP para traer los mensajes de ese ID
        }

        window.onload = cargarUsuarios;
    </script>
</body>
</html>
